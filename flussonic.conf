# Flussonic configuration
license trial:test;

# Basic streaming configuration
stream live {
    input rtmp://;
    
    hls /var/www/hls/live;
    hls_time 2;
    hls_fragment 0.040;
    
    publish publish_ffmpeg;
    exec_policy everyone;
}

# Static file server
server static {
    listen 80;
    root /var/www/hls;
}

# API and web interface
server api {
    listen 8080;
    
    location / {
        root /usr/share/flussonic/www;
    }
}
